*{box-sizing:border-box;margin:0;padding:0}html,body{width:970px;height:250px;overflow:hidden;background:#06122F}
a#ad{position:relative;display:block;width:970px;height:250px;overflow:hidden;text-decoration:none;color:#fff;font-family:LnBC,"Arial Narrow",Arial,Helvetica,sans-serif;background:radial-gradient(ellipse at 80% 0%,#13306b 0%,#06122F 60%)}
.stripes{position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 24px)}
.ring{position:absolute;width:420px;height:420px;border-radius:50%;border:60px solid rgba(10,166,160,.14);right:-120px;top:-150px;animation:spin 14s linear infinite}
.bars{position:absolute;left:0;top:0;bottom:0;width:14px;display:flex;flex-direction:column}.bars i{flex:1}.bars i:nth-child(1){background:#009739}.bars i:nth-child(2){background:#FEDD00}.bars i:nth-child(3){background:#012169}
.logo{position:absolute;left:48px;top:50%;transform:translateY(-50%);background:#fff;border-radius:16px;padding:14px 20px;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:pop .8s cubic-bezier(.2,1.4,.4,1) both}
.logo img{display:block;height:62px}
.f{position:absolute;left:330px;right:270px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;opacity:0}
.f b{font-size:58px;line-height:.95;text-transform:uppercase;font-weight:800;letter-spacing:.5px}.f b em{font-style:normal;color:#F4C430}
.f span{font-size:19px;margin-top:10px;color:#cdd4e3;font-family:Arial,Helvetica,sans-serif}
.f1{animation:fr 12s infinite 0s}.f2{animation:fr 12s infinite 4s}.f3{animation:fr 12s infinite 8s}
.cta{position:absolute;right:40px;top:50%;transform:translateY(-50%);background:#0AA6A0;color:#fff;font:800 28px LnBC,"Arial Narrow",Arial,sans-serif;text-transform:uppercase;letter-spacing:1px;padding:18px 26px;border-radius:50px;box-shadow:0 0 0 0 rgba(10,166,160,.7);animation:pulse 2s infinite}
.cta:after{content:" →"}
.shine{position:absolute;top:0;bottom:0;width:120px;left:-160px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);transform:skewX(-20deg);animation:shine 4s infinite 1s}
@keyframes fr{0%{opacity:0;transform:translateY(18px)}4%,30%{opacity:1;transform:none}34%,100%{opacity:0;transform:translateY(-14px)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(10,166,160,.7)}70%{box-shadow:0 0 0 16px rgba(10,166,160,0)}100%{box-shadow:0 0 0 0 rgba(10,166,160,0)}}
@keyframes pop{from{opacity:0;transform:translateY(-50%) scale(.6)}to{opacity:1;transform:translateY(-50%) scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shine{0%{left:-160px}40%,100%{left:1100px}}
